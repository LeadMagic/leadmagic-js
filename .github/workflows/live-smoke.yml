name: Live smoke

# Nightly run against the real API with a key scoped to Email Validation and
# Credits. Costs at most 0.25 credits a night.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live API
    if: github.repository == 'LeadMagic/leadmagic-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Until the secret is added the run passes with a note instead of failing every night.
      - name: Key set?
        id: key
        env:
          KEY: ${{ secrets.LEADMAGIC_SMOKE_API_KEY }}
        run: |
          if [[ -n "$KEY" ]]; then
            echo 'set=true' >> "$GITHUB_OUTPUT"
          else
            echo 'LEADMAGIC_SMOKE_API_KEY is not set, so the live check was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.set == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.key.outputs.set == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.set == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.key.outputs.set == 'true'
      - run: pnpm -F leadmagic test:live
        if: steps.key.outputs.set == 'true'
        env:
          LEADMAGIC_API_KEY: ${{ secrets.LEADMAGIC_SMOKE_API_KEY }}
