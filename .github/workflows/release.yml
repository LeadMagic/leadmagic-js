name: Release

# On main: pending changesets open or refresh the version PR. Merging that PR
# publishes the new version to npm with trusted publishing (OIDC, no token)
# and provenance, then tags it.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  RELEASE_BRANCH: changeset-release/main

jobs:
  release:
    name: Version or publish
    if: github.repository == 'LeadMagic/leadmagic-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Pending changesets?
        id: pending
        run: |
          if [[ -n $(find .changeset -name '*.md' -not -name 'README.md' -type f -print -quit) ]]; then
            echo 'yes=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the version PR
        if: steps.pending.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RELEASE_BRANCH"
          pnpm version-packages
          pnpm install --lockfile-only
          git add -A
          version=$(node -p "require('./packages/leadmagic/package.json').version")
          git commit -m "chore: release leadmagic@$version"
          git push --force origin "$RELEASE_BRANCH"
          if [[ -z $(gh pr list --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // ""') ]]; then
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release leadmagic@$version" \
              --body "Merging publishes leadmagic@$version to npm."
          fi

      - name: Publish when the version is new
        if: steps.pending.outputs.yes != 'true'
        working-directory: packages/leadmagic
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm build
          npm publish --provenance --access public
          git tag "$name@$version"
          git push origin "$name@$version"
          echo "Published $name@$version" >> "$GITHUB_STEP_SUMMARY"
