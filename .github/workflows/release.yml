name: Release

# On main: pending changesets open or refresh the version PR. Merging that PR
# publishes the new version to npm with trusted publishing (OIDC, no token)
# and provenance, then tags it.
#
# The job that can publish installs nothing and runs no project code. It only
# uploads the tarball that the build job checked and packed, so a compromised
# dev dependency never runs next to the publishing identity.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_BRANCH: changeset-release/main

jobs:
  plan:
    name: Plan
    # Only main can release, also when the workflow is started by hand.
    if: github.repository == 'LeadMagic/leadmagic-js' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version PR or publish?
        id: plan
        run: |
          version=$(jq -r .version packages/leadmagic/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n $(find .changeset -name '*.md' -not -name 'README.md' -type f -print -quit) ]]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          elif npm view "leadmagic@$version" version >/dev/null 2>&1; then
            echo "leadmagic@$version is already on npm" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  version-pr:
    name: Open or refresh the version PR
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Version and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RELEASE_BRANCH"
          pnpm version-packages
          pnpm install --lockfile-only
          git add -A
          version=$(jq -r .version packages/leadmagic/package.json)
          git commit -m "chore: release leadmagic@$version"
          git push --force origin "$RELEASE_BRANCH"
          if [[ -z $(gh pr list --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // ""') ]]; then
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release leadmagic@$version" \
              --body "Merging publishes leadmagic@$version to npm."
          fi

  build:
    name: Check and pack
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache here: a release is built from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The version PR is opened by the workflow token, which does not start
      # CI, so the full check runs here before anything is published.
      - run: pnpm check
      - name: Pack
        working-directory: packages/leadmagic
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [ plan, build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Name this environment in npm's trusted publisher settings, and limit it
    # to the main branch in the repository settings.
    environment: npm
    permissions:
      contents: write # push the version tag
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack
      - name: Publish
        run: npm publish pack/*.tgz --provenance --access public
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/leadmagic@$VERSION" -f "sha=$GITHUB_SHA"
          echo "Published leadmagic@$VERSION" >> "$GITHUB_STEP_SUMMARY"
