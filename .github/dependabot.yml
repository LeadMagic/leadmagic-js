version: 2
updates:
  # The published package has no runtime dependencies; these are build and
  # test tools. New versions wait three days before a PR, so a bad release is
  # usually pulled before it reaches us.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels: [ "dependencies" ]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: [ "*" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    labels: [ "dependencies", "github-actions" ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: [ "*" ]
